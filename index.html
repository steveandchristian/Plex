<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Plex Collection</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --ink:#e8e6e0; --dim:#9aa0ac; --faint:#6b7280;
    --have:#46b97f; --have-bg:rgba(70,185,127,.12);
    --want:#e0a64b; --want-bg:rgba(224,166,75,.12);
    --accent:#c8553d; --accent-ink:#fff;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{max-width:840px;margin:0 auto;padding:0 16px 120px;min-height:100vh}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg) 72%,rgba(15,17,21,0));
    padding:20px 0 12px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand h1{font-size:1.5rem;font-weight:600;letter-spacing:.02em}
  .brand .reel{color:var(--accent)}
  .counts{font-family:Arial,Helvetica,sans-serif;font-size:.95rem;color:var(--dim);
    letter-spacing:.02em;white-space:nowrap}
  .counts b{color:var(--ink);font-weight:700}
  .updated{font-family:Arial,Helvetica,sans-serif;font-size:.72rem;color:var(--faint);margin-top:3px}

  .searchwrap{position:relative}
  #q{width:100%;padding:15px 44px 15px 16px;font-size:1.2rem;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);outline:none}
  #q:focus{border-color:var(--accent)}
  #q::placeholder{color:var(--faint)}
  .clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--faint);font-size:1.3rem;cursor:pointer;
    width:32px;height:32px;border-radius:8px;display:none}
  .clearbtn:hover{color:var(--ink);background:var(--panel2)}

  .filters{display:flex;gap:6px;margin-top:10px}
  .filters button{flex:1;padding:13px 8px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;
    letter-spacing:.02em;text-transform:uppercase;background:var(--panel);color:var(--dim);
    border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:.12s;font-weight:600}
  .filters button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);border-color:var(--faint)}
  .filters button[data-f="Have"][aria-pressed="true"]{color:var(--have);border-color:var(--have)}
  .filters button[data-f="Want"][aria-pressed="true"]{color:var(--want);border-color:var(--want)}

  .toolrow{display:flex;justify-content:flex-end;gap:14px;margin-top:10px}
  .toollink{background:none;border:none;color:var(--faint);font-family:Arial,Helvetica,sans-serif;
    font-size:.8rem;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;padding:2px 0}
  .toollink:hover{color:var(--ink)}
  .toollink.danger:hover{color:var(--accent)}

  .results{margin-top:18px}
  .empty{text-align:center;color:var(--dim);padding:48px 20px;font-size:1rem}
  .empty .add-hint{margin-top:14px}
  .empty button{margin-top:14px}

  .group-label{font-family:Arial,Helvetica,sans-serif;font-size:.82rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint);margin:22px 4px 8px;border-bottom:1px solid var(--line);
    padding-bottom:6px;font-weight:700}

  .row{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:10px;
    border:1px solid transparent}
  .row:hover{background:var(--panel)}
  .row .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.Have{background:var(--have)} .dot.Want{background:var(--want)}
  .row .main{flex:1;min-width:0}
  .row .title{font-size:1.3rem;line-height:1.3;font-weight:500}
  .row .year{color:var(--dim);font-weight:400}
  .row .meta{font-family:Arial,Helvetica,sans-serif;font-size:.85rem;color:var(--faint);
    margin-top:4px;letter-spacing:.01em}
  .row .meta .coll{color:var(--want)}
  .row .badge{font-family:Arial,Helvetica,sans-serif;font-size:.72rem;letter-spacing:.04em;
    text-transform:uppercase;padding:4px 9px;border-radius:5px;flex:none;font-weight:700}
  .badge.Have{background:var(--have-bg);color:var(--have)}
  .badge.Want{background:var(--want-bg);color:var(--want)}
  .row .edit{background:none;border:none;color:var(--faint);cursor:pointer;font-size:1.25rem;
    padding:8px;border-radius:6px;flex:none;opacity:0;transition:.12s}
  .row:hover .edit{opacity:1}
  .row .edit:hover{color:var(--ink);background:var(--panel2)}
  @media(hover:none){.row .edit{opacity:.5}}

  /* FAB */
  .fab{position:fixed;right:20px;bottom:24px;z-index:60;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);border:none;font-size:1.8rem;cursor:pointer;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--panel2);
    border-top:1px solid var(--line);padding:12px 16px;display:none;align-items:center;
    justify-content:space-between;gap:12px}
  .savebar.show{display:flex}
  .savebar .msg{font-size:.85rem;color:var(--want)}
  .savebar button{background:var(--accent);color:#fff;border:none;padding:11px 20px;border-radius:9px;
    font-family:inherit;font-size:.95rem;cursor:pointer;font-weight:600}

  /* modal */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  @media(min-width:560px){.overlay.show{align-items:center}}
  .sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow);
    border:1px solid var(--line);max-height:92vh;overflow:auto}
  @media(min-width:560px){.sheet{border-radius:16px}}
  .sheet h2{font-size:1.2rem;margin-bottom:4px;font-weight:600}
  .sheet .sub{color:var(--dim);font-size:.82rem;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:Arial,Helvetica,sans-serif;font-size:.66rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .field input{width:100%;padding:12px 13px;font-size:1rem;font-family:inherit;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);outline:none}
  .field input:focus{border-color:var(--accent)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:11px;font-family:Arial,Helvetica,sans-serif;font-size:.74rem;letter-spacing:.05em;
    text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--dim);cursor:pointer}
  .seg button[aria-pressed="true"][data-s="Have"]{background:var(--have-bg);color:var(--have);border-color:var(--have)}
  .seg button[aria-pressed="true"][data-s="Want"]{background:var(--want-bg);color:var(--want);border-color:var(--want)}
  .dupwarn{background:var(--want-bg);border:1px solid var(--want);border-radius:10px;padding:11px 13px;
    font-size:.85rem;color:var(--want);margin-bottom:14px;display:none}
  .dupwarn.show{display:block}
  .dupwarn b{color:var(--ink)}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions button{flex:1;padding:13px;font-family:inherit;font-size:.98rem;border-radius:10px;cursor:pointer;border:none}
  .btn-primary{background:var(--accent);color:#fff;font-weight:600}
  .btn-ghost{background:var(--panel2);color:var(--dim);border:1px solid var(--line)!important}
  .btn-danger{background:none;color:var(--accent);border:1px solid var(--accent)!important;flex:0 0 auto!important;padding:13px 16px!important}
  .hint{font-size:.78rem;color:var(--faint);margin-top:14px;line-height:1.5}

  /* mode toggle pill */
  .modetoggle{background:none;border:1px solid var(--line);color:var(--faint);
    font-family:Arial,Helvetica,sans-serif;font-size:.72rem;letter-spacing:.04em;
    text-transform:uppercase;cursor:pointer;padding:5px 11px;border-radius:20px}
  .modetoggle:hover{color:var(--ink);border-color:var(--faint)}
  body.edit-mode .modetoggle{color:var(--accent);border-color:var(--accent)}

  /* VIEW MODE (default): hide all editing affordances */
  body:not(.edit-mode) .fab,
  body:not(.edit-mode) .savebar,
  body:not(.edit-mode) .toolrow,
  body:not(.edit-mode) .row .edit{display:none!important}
  body:not(.edit-mode) .row{cursor:default}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><span class="reel">&#9673;</span> The Plex Collection</h1>
    <div style="text-align:right">
      <div class="counts"><b id="cHave">0</b> have &middot; <b id="cWant">0</b> want</div>
      <div class="updated" id="updated" data-stamp="June 18, 2026, 3:46 AM">Updated: June 18, 2026, 3:46 AM</div>
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin:-2px 0 10px">
    <button class="modetoggle" id="modeToggle">&#128065; Search only</button>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Search a title&hellip;" autocomplete="off" autocapitalize="off">
    <button class="clearbtn" id="clear">&times;</button>
  </div>
  <div class="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="Have" aria-pressed="false">Have</button>
    <button data-f="Want" aria-pressed="false">Want</button>
  </div>
  <div class="toolrow">
    <button class="toollink" id="backupHtml" title="Save a timestamped copy of the whole app">&#11015; Save backup copy</button>
    <button class="toollink" id="exportCsv" title="Download a timestamped CSV backup">&#8595; Export CSV</button>
    <button class="toollink danger" id="importCsv" title="Replace the list from a CSV backup">&#8593; Restore CSV</button>
    <input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">
  </div>
</header>

<div class="results" id="results"></div>

<button class="fab" id="addFab" title="Add a movie">+</button>

<div class="savebar" id="savebar">
  <span class="msg" id="saveMsg">Unsaved changes &mdash; download &amp; upload to GitHub</span>
  <button id="saveBtn">Save index.html</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="mTitle">Add a movie</h2>
    <div class="sub" id="mSub">New entries default to your Want list.</div>
    <div class="dupwarn" id="dup"></div>
    <div class="field"><label>Title</label><input id="fTitle" autocomplete="off"></div>
    <div class="field"><label>Year</label><input id="fYear" inputmode="numeric" autocomplete="off" placeholder="optional"></div>
    <div class="field"><label>Collection</label><input id="fColl" autocomplete="off" placeholder="optional &mdash; e.g. James Bond"></div>
    <div class="field"><label>Notes</label><input id="fNotes" autocomplete="off" placeholder="optional &mdash; edition, etc."></div>
    <div class="field"><label>Status</label>
      <div class="seg">
        <button data-s="Have" aria-pressed="false">Have</button>
        <button data-s="Want" aria-pressed="true">Want</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn-danger" id="delBtn" style="display:none">Delete</button>
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="okBtn">Add</button>
    </div>
    <div class="hint" id="saveHint"></div>
  </div>
</div>

let movies = SEED.map(m=>({...m}));
let dirty=false, editId=null, filter='all', formStatus='Want';

const $=s=>document.querySelector(s);
const results=$('#results'), q=$('#q');

function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function counts(){
  $('#cHave').textContent=movies.filter(m=>m.status==='Have').length;
  $('#cWant').textContent=movies.filter(m=>m.status==='Want').length;
}
function sortTitle(t){return (t||'').toLowerCase().replace(/^(the|a|an)\s+/,'');}

function render(){
  const term=norm(q.value);
  $('#clear').style.display=q.value?'block':'none';
  let list=movies.filter(m=>{
    if(filter!=='all' && m.status!==filter) return false;
    if(!term) return true;
    return norm(m.title).includes(term) || norm(m.collection).includes(term) || (m.year||'').includes(term);
  });
  list.sort((a,b)=>{const x=sortTitle(a.title),y=sortTitle(b.title);return x<y?-1:x>y?1:(a.year||'').localeCompare(b.year||'');});

  if(!list.length){
    results.innerHTML=`<div class="empty"><div>No match for &ldquo;${esc(q.value)}&rdquo;.</div>
      <button class="btn-primary" style="padding:11px 18px;border:none;border-radius:9px;color:#fff" onclick="openAdd(q.value)">Add it to the list</button></div>`;
    return;
  }
  let html='', lastL='';
  for(const m of list){
    const L=sortTitle(m.title).charAt(0).toUpperCase()||'#';
    if(L!==lastL && !term){html+=`<div class="group-label">${L}</div>`;lastL=L;}
    const meta=[m.collection?`<span class="coll">${esc(m.collection)}</span>`:'',m.notes?esc(m.notes):''].filter(Boolean).join(' &middot; ');
    html+=`<div class="row" onclick="openEdit(${m.id})">
      <span class="dot ${m.status}"></span>
      <div class="main">
        <div class="title">${esc(m.title)} ${m.year?`<span class="year">${m.year}</span>`:''}</div>
        ${meta?`<div class="meta">${meta}</div>`:''}
      </div>
      <span class="badge ${m.status}">${m.status}</span>
      <button class="edit" onclick="event.stopPropagation();openEdit(${m.id})">&#9998;</button>
    </div>`;
  }
  results.innerHTML=html;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// filters
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});
q.oninput=render;
$('#clear').onclick=()=>{q.value='';q.focus();render();};

// add/edit modal
const overlay=$('#overlay');
function setStatus(s){formStatus=s;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s));}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setStatus(b.dataset.s));

window.openAdd=function(prefill){
  editId=null;
  $('#mTitle').textContent='Add a movie';
  $('#mSub').textContent='New entries default to your Want list.';
  $('#okBtn').textContent='Add';
  $('#delBtn').style.display='none';
  $('#fTitle').value=prefill||''; $('#fYear').value=''; $('#fColl').value=''; $('#fNotes').value='';
  setStatus('Want'); checkDup();
  overlay.classList.add('show'); setTimeout(()=>$('#fTitle').focus(),50);
};
window.openEdit=function(id){
  if(!document.body.classList.contains('edit-mode'))return;
  const m=movies.find(x=>x.id===id); if(!m)return;
  editId=id;
  $('#mTitle').textContent='Edit';
  $('#mSub').textContent='Update details, move between Have and Want, or delete.';
  $('#okBtn').textContent='Save';
  $('#delBtn').style.display='block';
  $('#fTitle').value=m.title; $('#fYear').value=m.year||''; $('#fColl').value=m.collection||''; $('#fNotes').value=m.notes||'';
  setStatus(m.status); $('#dup').classList.remove('show');
  overlay.classList.add('show');
};
$('#addFab').onclick=()=>openAdd('');
$('#cancelBtn').onclick=()=>overlay.classList.remove('show');
overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show');};

$('#fTitle').oninput=checkDup; $('#fYear').oninput=checkDup;
function checkDup(){
  if(editId!==null){$('#dup').classList.remove('show');return;}
  const t=norm($('#fTitle').value); if(!t){$('#dup').classList.remove('show');return;}
  const hits=movies.filter(m=>norm(m.title)===t);
  if(hits.length){
    const h=hits[0];
    $('#dup').innerHTML=`Already on your list: <b>${esc(h.title)} ${h.year||''}</b> &mdash; marked <b>${h.status}</b>. Add anyway only if this is a different edition.`;
    $('#dup').classList.add('show');
  } else $('#dup').classList.remove('show');
}

$('#okBtn').onclick=()=>{
  const title=$('#fTitle').value.trim(); if(!title){$('#fTitle').focus();return;}
  const rec={title,year:$('#fYear').value.trim(),collection:$('#fColl').value.trim(),notes:$('#fNotes').value.trim(),status:formStatus};
  if(editId!==null){Object.assign(movies.find(m=>m.id===editId),rec);}
  else{rec.id=Math.max(0,...movies.map(m=>m.id))+1;movies.push(rec);}
  markDirty();overlay.classList.remove('show');counts();render();
};
$('#delBtn').onclick=()=>{
  if(editId===null)return;
  const m=movies.find(x=>x.id===editId);
  if(confirm(`Remove &ldquo;${m.title}&rdquo; from the list?`)){
    movies=movies.filter(x=>x.id!==editId);
    markDirty();overlay.classList.remove('show');counts();render();
  }
};

function markDirty(){dirty=true;$('#savebar').classList.add('show');}

// pretty timestamp "June 17, 2026, 3:44 PM" and writer into the header element
function prettyStamp(){
  const d=new Date();
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  let h=d.getHours(); const ampm=h>=12?'PM':'AM'; h=h%12||12;
  const mm=String(d.getMinutes()).padStart(2,'0');
  return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+', '+h+':'+mm+' '+ampm;
}
function stampNow(){
  const s=prettyStamp(), el=$('#updated');
  el.textContent='Updated: '+s; el.setAttribute('data-stamp',s);
}

$('#saveBtn').onclick=()=>{
  stampNow();
  const payload=movies.map(({id,...r})=>r);
  const wasEdit=document.body.classList.contains('edit-mode');
  document.body.classList.remove('edit-mode');
  const tpl=document.documentElement.outerHTML.replace(
    /const SEED = .*?;\n/s,
    'const SEED = '+JSON.stringify(payload)+';\n'
  );
  if(wasEdit)document.body.classList.add('edit-mode');
  const blob=new Blob(['<!DOCTYPE html>\n'+tpl],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='index.html';
  a.click();
  dirty=false;$('#savebar').classList.remove('show');
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

$('#backupHtml').onclick=()=>{
  stampNow();
  const payload=movies.map(({id,...r})=>r);
  const wasEdit=document.body.classList.contains('edit-mode');
  document.body.classList.remove('edit-mode');
  const tpl=document.documentElement.outerHTML
    .replace(/const SEED = .*?;\n/s,'const SEED = '+JSON.stringify(payload)+';\n');
  if(wasEdit)document.body.classList.add('edit-mode');
  const blob=new Blob(['<!DOCTYPE html>\n'+tpl],{type:'text/html'});

  a.href=URL.createObjectURL(blob);
  a.download='The Plex Movie Collection backup '+stamp()+'.html';
  a.click();
};

// ---- CSV backup / restore ----
const CSV_COLS=['title','year','collection','notes','status'];
function csvCell(v){
  v=(v==null?'':String(v));
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function stamp(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
$('#exportCsv').onclick=()=>{
  const rows=[CSV_COLS.join(',')];
  movies.slice().sort((a,b)=>{const x=sortTitle(a.title),y=sortTitle(b.title);return x<y?-1:x>y?1:0;})
    .forEach(m=>rows.push(CSV_COLS.map(c=>csvCell(m[c])).join(',')));
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='The Plex Movie Collection backup '+stamp()+'.csv';
  a.click();
};

// minimal RFC-4180 CSV parser (handles quotes, commas, newlines in fields)
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const rows=[];let row=[],field='',i=0,q=false;
  while(i<text.length){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(c==='\r'){/*skip*/}
      else field+=c;
    }
    i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.length&&r.some(x=>x!==''));
}
$('#importCsv').onclick=()=>$('#csvFile').click();
$('#csvFile').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let rows;
    try{rows=parseCSV(reader.result);}catch(err){alert('Could not read that file as CSV.');return;}
    if(rows.length<2){alert('That CSV has no movie rows.');$('#csvFile').value='';return;}
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const idx=Object.fromEntries(CSV_COLS.map(c=>[c,head.indexOf(c)]));
    if(idx.title<0||idx.status<0){
      alert('This CSV is missing the required Title and Status columns. Is it a backup from this app?');
      $('#csvFile').value='';return;
    }
    const incoming=[];
    for(let r=1;r<rows.length;r++){
      const row=rows[r];
      const title=(row[idx.title]||'').trim(); if(!title)continue;
      let status=(row[idx.status]||'').trim();
      status=/want/i.test(status)?'Want':'Have';
      incoming.push({
        title,
        year:idx.year>=0?(row[idx.year]||'').trim():'',
        collection:idx.collection>=0?(row[idx.collection]||'').trim():'',
        notes:idx.notes>=0?(row[idx.notes]||'').trim():'',
        status
      });
    }
    if(!incoming.length){alert('No valid movie rows found in that CSV.');$('#csvFile').value='';return;}
    if(!confirm('Restore from backup?\n\nThis REPLACES the current list ('+movies.length+' titles) with '+incoming.length+' titles from the CSV. This cannot be undone unless you have another backup.\n\nTip: export a CSV of the current list first if you are unsure.')){
      $('#csvFile').value='';return;
    }
    incoming.forEach((m,i)=>m.id=i+1);
    movies=incoming;
    editId=null;
    markDirty();counts();render();
    $('#csvFile').value='';
    alert('Restored '+movies.length+' titles. Remember to tap &ldquo;Save file&rdquo; to write the HTML back to OneDrive.'.replace(/&ldquo;|&rdquo;/g,'"'));
  };
  reader.readAsText(file);
};

// ---- view / edit mode toggle ----
const modeBtn=$('#modeToggle');
function setMode(edit){
  document.body.classList.toggle('edit-mode',edit);
  modeBtn.innerHTML = edit ? '&#9998; Editing &mdash; tap to lock' : '&#128065; Search only';
  render();
}
modeBtn.onclick=()=>{
  const leavingEdit=document.body.classList.contains('edit-mode');
  if(leavingEdit && dirty){
    if(!confirm('You have unsaved changes. Switch to search-only anyway? Your changes stay in the page until you tap Save file.'))return;
  }
  setMode(!leavingEdit);
};
setMode(false); // default: search only

counts();render();
</script>
